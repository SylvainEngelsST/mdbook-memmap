name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: MDBOOK="$(command -v mdbook)" cargo test --locked --test book -- --ignored
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify source-only package with generated examples present
        run: |
          mkdir -p examples/book/book examples/locked-book/book
          printf 'generated\n' > examples/book/book/index.html
          printf 'generated\n' > examples/locked-book/book/index.html
          printf '{"generated":true}\n' > examples/locked-book/memmap-provenance.json
          cargo package --locked --list > "$RUNNER_TEMP/mdbook-memmap-package-files"
          if grep -E '^examples/(book/book/|locked-book/(book/|memmap-provenance\.json))' "$RUNNER_TEMP/mdbook-memmap-package-files"; then
            echo "Generated example artifacts must not be packaged"
            exit 1
          fi
          cargo package --locked
